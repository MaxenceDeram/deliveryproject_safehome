{% set page = active_page|default("dashboard") %}
<aside class="sidebar" aria-label="Navigation SafeHome">
  <a class="sidebar-brand" href="{{ url_for('dashboard') }}" aria-label="SafeHome dashboard">
    <span class="brand-mark">
      <img src="{{ url_for('static', filename='assets/logo-company.jpg') }}" alt="">
    </span>
    <span>
      <strong>SafeHome</strong>
      <small>Air Quality Monitor</small>
    </span>
  </a>

  <nav class="sidebar-nav" aria-label="Menu principal">
    <a class="{% if page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}"><span>⌂</span>Dashboard</a>
    <a class="{% if page == 'history' %}active{% endif %}" href="{{ url_for('history') }}"><span>⌁</span>Historique</a>
    <a class="{% if page == 'recommendations' %}active{% endif %}" href="{{ url_for('recommendations') }}"><span>◌</span>Conseils</a>
    <a href="{{ url_for('api_export_csv') }}"><span>⇩</span>Export CSV</a>
    <a class="{% if page == 'about' %}active{% endif %}" href="{{ url_for('about') }}"><span>?</span>À propos</a>
  </nav>

  <section class="device-mini glass-card" aria-label="Appareil connecté">
    <div class="connected-badge" data-device-state>
      <span></span>
      <strong>Vérification...</strong>
    </div>
    <h2 data-device-id>SafeHome Device #1</h2>
    <p>Dernière mise à jour</p>
    <small data-last-update>En attente</small>
    <div class="device-telemetry">
      <span>Wi‑Fi <strong data-wifi-state>--</strong></span>
      <span>Batterie <strong data-battery-level>--</strong></span>
    </div>
  </section>

  <section class="sidebar-profile" aria-label="Prototype local">
    <span>L</span>
    <div>
      <strong>Local</strong>
      <small>Prototype SafeHome</small>
    </div>
  </section>
</aside>
